# Pull Request 用の軽量ゲート。
# デプロイ用の gh-pages.yaml は push/schedule でしか走らないため、
# PR (特に Dependabot PR) が未検証のまま滞留するのを防ぐ目的で分離している。
# スクレイピング (main.py) と Pages デプロイは行わず、型検査とテストのみ実行する。
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # uv 本体のバージョンは pyproject.toml の [dependency-groups] ci にピンしてあり、
      # Dependabot (uv エコシステム) がそれを bump する。解決ロジックは ci.yaml と gh-pages.yaml で
      # 共有するためスクリプトに切り出してある (仕様は tests/test_resolve_uv_version.py が固定)。
      - name: Resolve uv version
        id: uv-version
        run: .github/scripts/resolve-uv-version.sh >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ steps.uv-version.outputs.version }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: Install the project
        run: uv sync --locked --all-extras

      # ワークフロー定義自体の lint。actionlint 本体のバージョンは action 既定の latest に
      # 任せる (ここを固定すると Dependabot が追えないピンになり、黙って腐る)。action 自体は
      # SHA ピンなので供給網は押さえられている。
      - name: Lint workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - name: Type check
        run: uv run mypy main.py

      - name: Run tests
        run: uv run pytest
