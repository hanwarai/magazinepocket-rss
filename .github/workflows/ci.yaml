# Pull Request 用の軽量ゲート。
# デプロイ用の gh-pages.yaml は push/schedule でしか走らないため、
# PR (特に Dependabot PR) が未検証のまま滞留するのを防ぐ目的で分離している。
# スクレイピング (main.py) と Pages デプロイは行わず、型検査とテストのみ実行する。
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # uv 本体のバージョンは pyproject.toml の [dependency-groups] ci にピンしてあり、
      # Dependabot (uv エコシステム) がそれを bump する。ここでその値を読み取り setup-uv に渡す。
      # gh-pages.yaml の同名ステップと意図的に同じ内容 (デプロイ経路と同じ uv で検証するため)。
      - name: Resolve uv version
        id: uv-version
        run: |
          version=$(grep -oP '"uv==\K[0-9]+\.[0-9]+\.[0-9]+' pyproject.toml)
          if [ -z "$version" ]; then
            echo "::error::could not resolve uv version pin from pyproject.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ steps.uv-version.outputs.version }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: Install the project
        run: uv sync --frozen --all-extras

      - name: Type check
        run: uv run mypy main.py

      - name: Run tests
        run: uv run pytest
